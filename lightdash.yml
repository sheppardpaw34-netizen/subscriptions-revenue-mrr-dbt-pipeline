version: 1
project:
  name: "B2B SaaS Revenue Analytics Engine"
  dbt:
    type: bigquery
    target: dev

metrics:
  - name: gross_new_mrr
    label: "Gross New MRR"
    description: "New recurring revenue added from new customer acquisitions."
  - name: net_revenue_retention
    label: "Net Revenue Retention (NRR)"
    description: "Percentage of recurring revenue retained from existing customers."

tables:
  - name: fct_mrr_movements
    dimensions:
      - name: date_month
      - name: movement_type
  - name: fct_mrr_cohort_metrics
    dimensions:
      - name: date_month