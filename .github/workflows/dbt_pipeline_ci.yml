name: dbt CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-dbt-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-duckdb pandas duckdb faker

      - name: Generate Raw DuckDB Data
        run: |
          python scraper_py/generate_1k_saas_data.py

      - name: Run dbt Build & Tests
        run: |
          dbt build --profiles-dir .