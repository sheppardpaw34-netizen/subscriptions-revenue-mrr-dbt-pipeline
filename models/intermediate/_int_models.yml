version: 2

models:
  - name: int_stripe__subscription_events_deduped
    description: "Deduplicated raw Stripe subscription events using QUALIFY ROW_NUMBER() over subscription_id, timestamp, and event_id."
    columns:
      - name: event_id
        description: "Primary key of the raw webhook event."
        data_tests:
          - unique
          - not_null
      - name: subscription_id
        description: "Unique identifier for the Stripe subscription."
        data_tests:
          - not_null

  - name: int_stripe__subscription_events_deltas
    description: "Filters out no-op/duplicate state events using LAG() comparison against prior state transitions."
    columns:
      - name: event_id
        description: "Primary key of the state change event."
        data_tests:
          - unique
          - not_null

  - name: int_stripe__subscription_timelines
    description: "Constructs contiguous valid_from and valid_to time windows for every subscription state using LEAD()."
    columns:
      - name: timeline_id
        description: "Surrogate key for the subscription state window."
        data_tests:
          - unique
          - not_null
      - name: subscription_id
        description: "Foreign key to the subscription."
        data_tests:
          - not_null
      - name: valid_from
        description: "Start timestamp of the subscription state window."
        data_tests:
          - not_null

  - name: int_subscription_mrr_by_months
    description: "Fans out continuous subscription timeline windows across the monthly date spine (stg_utilities__date_spine)."
    columns:
      - name: date_month
        description: "First day of the calendar month."
        data_tests:
          - not_null
      - name: subscription_id
        description: "Identifier for the active subscription in the given month."
        data_tests:
          - not_null
      - name: customer_id
        description: "Foreign key for the subscribing account."
        data_tests:
          - not_null
      - name: mrr_local
        description: "Normalized monthly recurring revenue contribution."
        data_tests:
          - not_null

  - name: int_customer_mrr_by_months
    description: "Aggregates multi-subscription MRR to the Account (Customer) + Month granularity."
    columns:
      - name: date_month
        description: "First day of the calendar month."
        data_tests:
          - not_null
      - name: customer_id
        description: "Unique customer identifier."
        data_tests:
          - not_null
      - name: mrr_local
        description: "Total aggregated monthly recurring revenue across all active subscriptions."
        data_tests:
          - not_null
      - name: mrr_usd
        description: "Total normalized MRR sum converted to USD."
        data_tests: 
          - not_null
      - name: active_subscriptions_count
        description: "Total count of active subscriptions for this customer in the month."
        data_tests:
          - not_null

  - name: int_customer_mrr_deltas
    description: "Calculates month-over-month MRR changes per customer using LAG() window functions."
    columns:
      - name: date_month
        description: "First day of the reporting month."
        data_tests:
          - not_null
      - name: customer_id
        description: "Unique customer identifier."
        data_tests:
          - not_null
      - name: mrr_local
        description: "Current month MRR."
        data_tests:
          - not_null
      - name: prev_mrr_local
        description: "Previous month MRR."
        data_tests:
          - not_null
      - name: mrr_change
        description: "Net dollar change (mrr_local - prev_mrr_local)."
        data_tests:
          - not_null