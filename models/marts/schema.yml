version: 2

models:
  - name: marts_mrr_waterfalls
    description: "MRR waterfall tracking subscription inflows, outflows, expansion, contraction, and churn."
    columns:
      - name: date_month
        description: "Reporting activity month."
      - name: customer_id
        description: "Unique identifier for customer account."
      - name: current_mrr_usd
        description: "Active MRR in USD."
      - name: new_mrr_usd
        description: "New subscription MRR inflow."
      - name: expansion_mrr_usd
        description: "Expansion subscription MRR inflow."
      - name: reactivation_mrr_usd
        description: "Reactivation MRR inflow."
      - name: contraction_mrr_usd
        description: "Contraction MRR outflow."
      - name: churn_mrr_usd
        description: "Churn MRR outflow."

  - name: marts_retention_and_churn
    description: "Executive cohort retention matrix tracking NRR, logo retention, and cumulative logo churn."
    columns:
      - name: cohort_month
        description: "Customer signup cohort month."
      - name: cohort_age_month
        description: "Elapsed tenure in months from cohort origin."
      - name: date_month
        description: "Activity reporting month."
      - name: initial_logo_count
        description: "Total starting customer accounts at Month 0."
      - name: active_logo_count
        description: "Active paying customer accounts in period."
      - name: cohort_initial_mrr_usd
        description: "Baseline cohort starting MRR in USD at Month 0."
      - name: cohort_mrr_usd
        description: "Active cohort MRR in USD."
      - name: logo_retention_pct
        description: "Percentage of original customer logos retained."
        meta:
          metrics:
            avg_logo_retention:
              type: average
              label: "Logo Retention %"
              format: '0.00"%"'
      - name: net_revenue_retention_nrr_pct
        description: "Net revenue retention percentage (NRR)."
        meta:
          metrics:
            avg_nrr:
              type: average
              label: "Net Revenue Retention (NRR) %"
              format: '0.00"%"'
      - name: cumulative_logo_churn_pct
        description: "Cumulative percentage of lost customer logos."
        meta:
          metrics:
            avg_logo_churn:
              type: average
              label: "Logo Churn %"
              format: '0.00"%"'

  - name: marts_customer_ltv_cac
    description: "Account-level lifetime value, active tenure, ARPA, and current status."
    columns:
      - name: customer_id
        description: "Unique customer identifier."
      - name: customer_email
        description: "Primary billing contact email."
      - name: first_active_month
        description: "Customer acquisition month."
      - name: last_active_month
        description: "Most recent active subscription month."
      - name: tenure_in_months
        description: "Total active lifetime tenure in months."
      - name: cumulative_ltv_usd
        description: "Total historical recurring revenue generated."
        meta:
          metrics:
            total_ltv:
              type: sum
              label: "Total LTV (USD)"
              format: '"$"#,##0.00'
      - name: peak_mrr_usd
        description: "Highest MRR achieved by customer account."
      - name: customer_arpa_usd
        description: "Average Revenue Per Account (ARPA)."
        meta:
          metrics:
            avg_arpa:
              type: average
              label: "Average ARPA (USD)"
              format: '"$"#,##0.00'
      - name: account_status
        description: "Current account status ('ACTIVE' or 'CHURNED')."


# ==============================================================================
# dbt METRICFLOW SEMANTIC LAYER CONFIGURATION
# ==============================================================================

semantic_models:
  - name: mrr_waterfall_semantic
    model: ref('marts_mrr_waterfalls')
    description: "Enterprise SaaS MRR Waterfall semantic model."

    defaults:
      agg_time_dimension: date_month

    entities:
      - name: customer
        type: primary
        expr: customer_id

    dimensions:
      - name: date_month
        type: time
        type_params:
          time_granularity: month

    measures:
      - name: measure_total_mrr
        description: "Sum of active MRR in USD."
        expr: current_mrr_usd
        agg: sum

      - name: measure_new_mrr
        description: "New subscription MRR."
        expr: new_mrr_usd
        agg: sum

      - name: measure_expansion_mrr
        description: "Expansion MRR."
        expr: expansion_mrr_usd
        agg: sum

      - name: measure_reactivation_mrr
        description: "Reactivation MRR."
        expr: reactivation_mrr_usd
        agg: sum

      - name: measure_contraction_mrr
        description: "Contraction MRR."
        expr: contraction_mrr_usd
        agg: sum

      - name: measure_churn_mrr
        description: "Churn MRR."
        expr: churn_mrr_usd
        agg: sum

  - name: cohort_retention_semantic
    model: ref('marts_retention_and_churn')
    description: "Enterprise SaaS Cohort Retention and NRR semantic model."

    defaults:
      agg_time_dimension: date_month

    entities:
      - name: cohort
        type: primary
        expr: cohort_month

    dimensions:
      - name: cohort_month
        type: time
        type_params:
          time_granularity: month
      - name: date_month
        type: time
        type_params:
          time_granularity: month
      - name: cohort_age_month
        type: categorical

    measures:
      - name: measure_nrr_pct
        description: "Average Net Revenue Retention percentage."
        expr: net_revenue_retention_nrr_pct
        agg: average

      - name: measure_logo_retention_pct
        description: "Average Logo Retention percentage."
        expr: logo_retention_pct
        agg: average

  - name: customer_ltv_semantic
    model: ref('marts_customer_ltv_cac')
    description: "Customer LTV and ARPA semantic model."

    defaults:
      agg_time_dimension: first_active_month

    entities:
      - name: customer
        type: primary
        expr: customer_id

    dimensions:
      - name: first_active_month
        type: time
        type_params:
          time_granularity: month
      - name: account_status
        type: categorical

    measures:
      - name: measure_ltv
        description: "Sum of lifetime revenue across customer accounts."
        expr: cumulative_ltv_usd
        agg: sum

      - name: measure_arpa
        description: "Average revenue per account."
        expr: customer_arpa_usd
        agg: average


# Single, unified Metrics registry
metrics:
  # Simple Input Metrics
  - name: total_mrr
    label: "Total MRR"
    description: "Current total monthly recurring revenue."
    type: simple
    type_params:
      measure: measure_total_mrr

  - name: new_mrr
    label: "New MRR"
    description: "New customer acquisition revenue."
    type: simple
    type_params:
      measure: measure_new_mrr

  - name: expansion_mrr
    label: "Expansion MRR"
    description: "Existing customer upgrade revenue."
    type: simple
    type_params:
      measure: measure_expansion_mrr

  - name: reactivation_mrr
    label: "Reactivation MRR"
    description: "Reactivated customer revenue."
    type: simple
    type_params:
      measure: measure_reactivation_mrr

  - name: contraction_mrr
    label: "Contraction MRR"
    description: "Existing customer downgrade revenue."
    type: simple
    type_params:
      measure: measure_contraction_mrr

  - name: churn_mrr
    label: "Churn MRR"
    description: "Lost revenue from churned accounts."
    type: simple
    type_params:
      measure: measure_churn_mrr

  - name: net_revenue_retention_rate
    label: "Net Revenue Retention (NRR)"
    description: "Percentage of recurring revenue retained."
    type: simple
    type_params:
      measure: measure_nrr_pct

  - name: logo_retention_rate
    label: "Logo Retention Rate"
    description: "Percentage of customer accounts retained."
    type: simple
    type_params:
      measure: measure_logo_retention_pct

  - name: customer_lifetime_value
    label: "Customer LTV"
    description: "Total lifetime revenue generated per customer."
    type: simple
    type_params:
      measure: measure_ltv

  - name: average_revenue_per_account
    label: "ARPA"
    description: "Average monthly revenue generated per active account."
    type: simple
    type_params:
      measure: measure_arpa

  # Derived Metrics
  - name: gross_additions_mrr
    label: "Gross Additions MRR"
    description: "Total positive MRR inflows = New + Expansion + Reactivation"
    type: derived
    type_params:
      expr: new_mrr + expansion_mrr + reactivation_mrr
      metrics:
        - name: new_mrr
        - name: expansion_mrr
        - name: reactivation_mrr

  - name: gross_losses_mrr
    label: "Gross Losses MRR"
    description: "Total negative MRR outflows = Contraction + Churn"
    type: derived
    type_params:
      expr: contraction_mrr + churn_mrr
      metrics:
        - name: contraction_mrr
        - name: churn_mrr

  - name: saas_quick_ratio
    label: "SaaS Quick Ratio"
    description: "Growth efficiency ratio: (New + Expansion + Reactivation) / (|Contraction| + |Churn|)"
    type: derived
    type_params:
      expr: (new_mrr + expansion_mrr + reactivation_mrr) / nullif(abs(contraction_mrr + churn_mrr), 0)
      metrics:
        - name: new_mrr
        - name: expansion_mrr
        - name: reactivation_mrr
        - name: contraction_mrr
        - name: churn_mrr