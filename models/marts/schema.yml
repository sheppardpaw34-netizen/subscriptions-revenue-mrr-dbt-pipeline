version: 2

models:
  - name: marts_mrr_waterfalls
    description: "Monthly customer-level MRR waterfall movements (New, Expansion, Contraction, Churn, Reactivation)."
    columns:
      - name: date_month
        description: "First day of the reporting month."
        tests:
          - not_null
      - name: customer_id
        description: "Unique identifier for the customer."
        tests:
          - not_null
      - name: current_mrr_usd
        description: "Total active MRR for the customer in the current month."
      - name: new_mrr_usd
        description: "MRR added from net-new subscriptions."
      - name: expansion_mrr_usd
        description: "Increased MRR from existing customer plan upgrades."
      - name: contraction_mrr_usd
        description: "Decreased MRR from plan downgrades (negative value)."
      - name: churn_mrr_usd
        description: "Lost MRR from canceled subscriptions (negative value)."
      - name: reactivation_mrr_usd
        description: "MRR restored from previously churned customers."

  - name: marts_saas_quick_ratio
    description: "Executive macro-level SaaS health metrics, tracking growth efficiency and Quick Ratio."
    columns:
      - name: date_month
        description: "Reporting month."
        tests:
          - not_null
          - unique
      - name: saas_quick_ratio
        description: "(New + Expansion + Reactivation) / |Contraction + Churn|. Ideal ratio is > 4.0."
        meta:
          dimension:
            format: "0.00"

  - name: marts_customer_ltv_cac
    description: "Account-level lifetime value, active tenure, and average revenue per account (ARPA)."
    columns:
      - name: customer_id
        description: "Unique customer identifier."
        tests:
          - not_null
          - unique
      - name: cumulative_ltv_usd
        description: "Total historical recurring revenue generated by the account."
        meta:
          dimension:
            format: "$#,##0.00"
      - name: customer_arpa_usd
        description: "Average recurring revenue per active month."
        meta:
          dimension:
            format: "$#,##0.00"

  - name: marts_retention_and_churn
    description: "Monthly cohort retention matrix measuring Net Revenue Retention (NRR) and Logo Retention decay."
    columns:
      - name: cohort_month
        description: "Customer acquisition cohort month."
      - name: cohort_age_month
        description: "Months elapsed since cohort acquisition (0 = acquisition month)."
      - name: net_revenue_retention_nrr_pct
        description: "Net Revenue Retention percentage for the cohort."
        meta:
          dimension:
            format: "0.00%"

  - name: audit_mrr_ground_truth_reconciliation
    description: "Reconciliation model comparing contractual MRR calculations against billed Stripe invoice totals."
    columns:
      - name: date_month
        description: "Reconciliation month."
        tests:
          - not_null

# ==============================================================================
# dbt METRICFLOW SEMANTIC LAYER CONFIGURATION
# ==============================================================================

semantic_models:
  - name: mrr_waterfall_semantic
    model: ref('marts_mrr_waterfalls')
    description: "Enterprise SaaS MRR Waterfall semantic model for executive reporting and MetricFlow queries."

    defaults:
      agg_time_dimension: date_month

    entities:
      - name: customer
        type: primary
        expr: customer_id

    dimensions:
      - name: date_month
        type: time
        type_params:
          time_granularity: month
      - name: mrr_category
        type: categorical

    measures:
      - name: measure_total_mrr
        description: "Sum of active MRR in USD."
        expr: current_mrr_usd
        agg: sum

      - name: measure_new_mrr
        description: "Sum of new subscription bookings MRR."
        expr: new_mrr_usd
        agg: sum

      - name: measure_expansion_mrr
        description: "Sum of account expansion and upgrade MRR."
        expr: expansion_mrr_usd
        agg: sum

      - name: measure_contraction_mrr
        description: "Sum of account downgrade MRR reduction."
        expr: contraction_mrr_usd
        agg: sum

      - name: measure_churn_mrr
        description: "Sum of canceled subscription MRR loss."
        expr: churn_mrr_usd
        agg: sum

      - name: measure_reactivation_mrr
        description: "Sum of reactivated subscription MRR."
        expr: reactivation_mrr_usd
        agg: sum

metrics:
  # Simple Metrics
  - name: total_mrr
    label: "Total MRR"
    description: "Total Active Monthly Recurring Revenue"
    type: simple
    type_params:
      measure: measure_total_mrr

  - name: new_mrr
    label: "New MRR"
    description: "New subscription bookings revenue"
    type: simple
    type_params:
      measure: measure_new_mrr

  - name: expansion_mrr
    label: "Expansion MRR"
    description: "Account expansion and upgrade revenue"
    type: simple
    type_params:
      measure: measure_expansion_mrr

  - name: contraction_mrr
    label: "Contraction MRR"
    description: "Account downgrade revenue reduction"
    type: simple
    type_params:
      measure: measure_contraction_mrr

  - name: churn_mrr
    label: "Churn MRR"
    description: "Account cancellation revenue loss"
    type: simple
    type_params:
      measure: measure_churn_mrr

  - name: reactivation_mrr
    label: "Reactivation MRR"
    description: "Reactivated subscription revenue"
    type: simple
    type_params:
      measure: measure_reactivation_mrr

  # Derived Metrics
  - name: net_new_mrr
    label: "Net New MRR"
    description: "Net MRR Growth = New + Expansion + Reactivation + Contraction + Churn"
    type: derived
    type_params:
      expr: new_mrr + expansion_mrr + reactivation_mrr + contraction_mrr + churn_mrr
      metrics:
        - name: new_mrr
        - name: expansion_mrr
        - name: reactivation_mrr
        - name: contraction_mrr
        - name: churn_mrr

  - name: gross_additions_mrr
    label: "Gross Additions MRR"
    description: "Total positive MRR inflows = New + Expansion + Reactivation"
    type: derived
    type_params:
      expr: new_mrr + expansion_mrr + reactivation_mrr
      metrics:
        - name: new_mrr
        - name: expansion_mrr
        - name: reactivation_mrr

  - name: gross_losses_mrr
    label: "Gross Losses MRR"
    description: "Total negative MRR outflows = Contraction + Churn"
    type: derived
    type_params:
      expr: contraction_mrr + churn_mrr
      metrics:
        - name: contraction_mrr
        - name: churn_mrr