version: 2

models:
  - name: metricflow_time_spine
    description: "Daily time spine table required by MetricFlow engine."
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        data_tests:
          - not_null
          - unique

  - name: fct_mrr_waterfall
    description: "Fact table recording monthly MRR transitions across subscription accounts."
    columns:
      - name: mrr_month
        data_tests:
          - not_null

      - name: category
        data_tests:
          - not_null

      - name: mrr_delta
        description: "Net change in monthly recurring revenue."
        meta:
          metrics:
            total_mrr_delta:
              type: sum
              label: "Total MRR Delta"
            gross_new_mrr:
              type: sum
              label: "Gross New MRR"
              filters:
                - category: "new"
            expansion_mrr:
              type: sum
              label: "Expansion MRR"
              filters:
                - category: "expansion"
            contraction_mrr:
              type: sum
              label: "Contraction MRR"
              filters:
                - category: "contraction"
            churned_mrr:
              type: sum
              label: "Churned MRR"
              filters:
                - category: "churn"