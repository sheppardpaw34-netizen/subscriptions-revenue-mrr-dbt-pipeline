version: 2

models:
  - name: metricflow_time_spine
    description: "Daily time spine table required by MetricFlow engine."
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        data_tests:
          - not_null
          - unique

  - name: fct_mrr_movements
    description: "Fact table recording monthly MRR transitions across subscription accounts."
    columns:
      - name: subscription_id
        data_tests:
          - not_null

      - name: date_month
        data_tests:
          - not_null

      - name: movement_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['new', 'expansion', 'contraction', 'churn', 'retained']

      - name: mrr_delta
        description: "Net change in monthly recurring revenue."
        meta:
          metrics:
            total_mrr_delta:
              type: sum
              label: "Total MRR Delta"
            gross_new_mrr:
              type: sum
              label: "Gross New MRR"
              filters:
                - movement_type: "new"
            expansion_mrr:
              type: sum
              label: "Expansion MRR"
              filters:
                - movement_type: "expansion"
            contraction_mrr:
              type: sum
              label: "Contraction MRR"
              filters:
                - movement_type: "contraction"
            churned_mrr:
              type: sum
              label: "Churned MRR"
              filters:
                - movement_type: "churn"

  - name: fct_mrr_cohort_metrics
    description: "Mart calculating monthly Net Revenue Retention (NRR) and Gross Revenue Retention (GRR) metrics."
    columns:
      - name: date_month
        data_tests:
          - not_null
      - name: nrr_percentage
        description: "Net Revenue Retention percentage."
        meta:
          metrics:
            nrr:
              type: average
              label: "Net Revenue Retention (NRR)"
      - name: grr_percentage
        description: "Gross Revenue Retention percentage."
        meta:
          metrics:
            grr:
              type: average
              label: "Gross Revenue Retention (GRR)"