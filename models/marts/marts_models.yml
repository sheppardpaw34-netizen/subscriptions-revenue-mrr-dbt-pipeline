version: 2

models:
  - name: metricflow_time_spine
    description: "Daily time spine table required by MetricFlow engine."
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        data_tests:
          - not_null
          - unique

  - name: fct_mrr_waterfall
    description: "Fact table recording monthly MRR transitions across subscription accounts."
    columns:
      - name: customer_id
        data_tests:
          - not_null

      - name: date_month
        data_tests:
          - not_null

      - name: mrr_amount
        description: "Current period MRR."

      - name: previous_mrr_amount
        description: "Prior period MRR."

      - name: movement_type
        description: "MRR classification (new, expansion, contraction, churn, retain)."
        data_tests:
          - not_null

      - name: mrr_change
        description: "Net change in monthly recurring revenue."
        meta:
          metrics:
            total_mrr_delta:
              type: sum
              label: "Total MRR Delta"
            gross_new_mrr:
              type: sum
              label: "Gross New MRR"
              filters:
                - movement_type: "new"
            expansion_mrr:
              type: sum
              label: "Expansion MRR"
              filters:
                - movement_type: "expansion"
            contraction_mrr:
              type: sum
              label: "Contraction MRR"
              filters:
                - movement_type: "contraction"
            churned_mrr:
              type: sum
              label: "Churned MRR"
              filters:
                - movement_type: "churn"