version: 2

semantic_models:
  - name: mrr_waterfall_semantic
    model: ref('fct_mrr_movements')
    description: "Semantic layer model for MRR movements and SaaS waterfall metrics."
    defaults:
      agg_time_dimension: date_month

    entities:
      - name: subscription
        type: primary
        expr: subscription_id
      - name: customer
        type: foreign
        expr: customer_id

    dimensions:
      - name: date_month
        type: time
        type_params:
          time_granularity: month

      - name: movement_type
        type: categorical

    measures:
      - name: total_mrr_change
        description: "Sum of MRR change across movement types."
        expr: mrr_change
        agg: sum
      - name: ending_mrr
        description: "Sum of current period MRR."
        expr: mrr_amount
        agg: sum

metrics:
  - name: gross_new_mrr
    description: "New subscription revenue added."
    type: simple
    label: "Gross New MRR"
    type_params:
      measure: total_mrr_change
    filter: "{{ Dimension('subscription__movement_type') }} = 'new'"

  - name: expansion_mrr
    description: "Expansion revenue from existing accounts."
    type: simple
    label: "Expansion MRR"
    type_params:
      measure: total_mrr_change
    filter: "{{ Dimension('subscription__movement_type') }} = 'expansion'"

  - name: contraction_mrr
    description: "Lost revenue from partial downgrades."
    type: simple
    label: "Contraction MRR"
    type_params:
      measure: total_mrr_change
    filter: "{{ Dimension('subscription__movement_type') }} = 'contraction'"

  - name: churned_mrr
    description: "Lost revenue from canceled subscriptions."
    type: simple
    label: "Churned MRR"
    type_params:
      measure: total_mrr_change
    filter: "{{ Dimension('subscription__movement_type') }} = 'churn'"

  - name: retained_mrr
    description: "Total recurring revenue preserved from existing active subscriptions."
    type: simple
    label: "Retained Base MRR"
    type_params:
      measure: ending_mrr
    filter: "{{ Dimension('subscription__movement_type') }} = 'retained'"
    
  - name: net_revenue_retention
    description: "Monthly Net Revenue Retention rate (NRR)."
    type: simple
    label: "NRR (%)"
    type_params:
      measure: ending_mrr

  - name: gross_revenue_retention
    description: "Monthly Gross Revenue Retention rate (GRR)."
    type: simple
    label: "GRR (%)"
    type_params:
      measure: ending_mrr